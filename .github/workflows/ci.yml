name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      # A stand-in corpus keeps CI off the network; the real one is downloaded
      # by scripts/download_data.py.
      - name: Stand-in corpus
        run: |
          mkdir -p data
          python -c "from pathlib import Path; Path('data/shakes.txt').write_text(Path('README.md').read_text() * 20)"

      - name: Smoke train
        run: |
          sed -e 's|sample_length: 1000|sample_length: 100|' -e 's|num_samples: 5|num_samples: 2|' \
              configs/lstm.yaml > /tmp/ci.yaml
          python -m rnn.train --config /tmp/ci.yaml --epochs 1 --limit-chars 20000 \
              --device cpu --out /tmp/results

      - name: Smoke search
        run: |
          python scripts/hparam_search.py --models rnn --trials 1 --epochs 1 \
              --limit-chars 20000 --device cpu --out /tmp/search
