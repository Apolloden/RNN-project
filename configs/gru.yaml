# 2-layer GRU. Hyperparameters from the coarse-to-fine search.
name: gru
cell_type: gru
data: data/shakes.txt

seq_length: 25
hidden_size: 145
num_layers: 2
dropout: 0.0

batch_size: 50
learning_rate: 0.000845663544150917
num_epochs: 20
patience: 3
seed: 61

# Text synthesis used for the evaluation metrics.
prompt: "ROMEO: "
sample_length: 1000
num_samples: 5
temperature: 0.5
top_p: null
